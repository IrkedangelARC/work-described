name: ArcPresoCapture
options:
  bundleIdPrefix: com.example.arc
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  ArcPresoCapture:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: ArcPresoCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.arc.arc-preso-capture
        PRODUCT_NAME: ARC Preso Capture
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        PRODUCT_MODULE_NAME: ArcPresoCapture
        CODE_SIGN_ENTITLEMENTS: ArcPresoCapture/ArcPresoCapture.entitlements
    info:
      path: ArcPresoCapture/Info.plist
      properties:
        CFBundleName: "ARC Preso Capture"
        CFBundleDisplayName: "ARC Preso Capture"
        LSApplicationCategoryType: "public.app-category.productivity"
        NSHumanReadableCopyright: "© 2026 ARC Event Productions. We don't sell failure™."
        NSScreenCaptureDescription: "ARC Preso Capture records the selected display so it can convert each animation step of a presentation into a page in a PDF."
        NSAppleEventsUsageDescription: "ARC Preso Capture optionally uses AppleScript to query Keynote for slide counts."
