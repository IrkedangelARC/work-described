name: ArcGrab
options:
  bundleIdPrefix: com.example.arc
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.6.0"
    CURRENT_PROJECT_VERSION: 7
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_NSHumanReadableCopyright: "© ARC Event Productions. We don't sell failure™."
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.video"
    INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "ARC Grab writes downloads to the folder you choose."
    INFOPLIST_KEY_NSDesktopFolderUsageDescription: "ARC Grab writes downloads to the folder you choose."
    INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "ARC Grab writes downloads to the folder you choose."
    ENABLE_HARDENED_RUNTIME: true
    # Not sandboxed: the engine is yt-dlp + ffmpeg launched as child processes
    # from the user's install (Homebrew / pip), which a sandbox would not allow.
    ENABLE_APP_SANDBOX: false
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application: YOUR NAME (YOUR_TEAM_ID)"
    OTHER_CODE_SIGN_FLAGS: "--timestamp --options=runtime"
    PRODUCT_NAME: "ARC Grab"

targets:
  ArcGrab:
    type: application
    platform: macOS
    sources:
      - path: ArcGrab
      # Bundled engine (tools/build_engine.sh): static ffmpeg/ffprobe land in
      # Contents/MacOS next to the app binary. The yt-dlp onedir is placed in
      # Contents/Resources/yt-dlp by tools/ship.sh (and install_studio.sh), which
      # also sign every Mach-O inside it.
      - path: engine/ffmpeg
        buildPhase:
          copyFiles:
            destination: executables
      - path: engine/ffprobe
        buildPhase:
          copyFiles:
            destination: executables
      # static whisper.cpp CLI (Metal embedded), same place as ffmpeg
      - path: engine/whisper-cli
        buildPhase:
          copyFiles:
            destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.arc.ArcGrab
        CODE_SIGN_ENTITLEMENTS: ArcGrab/ArcGrab.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Engine tests compile the app sources (minus @main) into the test bundle,
  # so the command builders and parsers run without a window.
  ArcGrabTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ArcGrabTests
      - path: ArcGrab
        excludes:
          - "App/ArcGrabApp.swift"
    settings:
      base:
        PRODUCT_NAME: ArcGrabTests
        PRODUCT_BUNDLE_IDENTIFIER: com.example.arc.ArcGrabTests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        OTHER_CODE_SIGN_FLAGS: ""
        ENABLE_HARDENED_RUNTIME: false

schemes:
  ArcGrab:
    build:
      targets:
        ArcGrab: all
    test:
      targets:
        - ArcGrabTests
