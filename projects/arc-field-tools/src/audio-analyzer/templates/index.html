<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARC Audio Analyzer</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --card: #1a1a1a;
      --border: #333333;
      --text: #e0e0e0;
      --dim: #888888;
      --accent: #00ff88;
      --red: #ff4444;
      --yellow: #ffaa00;
      --blue: #4488ff;
      --font: 'SF Mono', 'Fira Code', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.15em; color: var(--accent); }
    .logo span { color: var(--dim); font-weight: 400; }

    .controls {
      display: flex; gap: 8px; align-items: center; padding: 12px 16px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    select, button {
      padding: 6px 12px; background: var(--card); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text); font-family: var(--font); font-size: 0.75rem;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    .btn-active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .btn-active:hover { background: #00cc6e; color: var(--bg); }

    .main { padding: 16px; max-width: 1200px; margin: 0 auto; }

    /* Level Meter */
    .meter-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
      background: var(--card); padding: 12px; border-radius: 6px; border: 1px solid var(--border);
    }
    .meter-label { font-size: 0.65rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; width: 40px; }
    .meter-bar { flex: 1; height: 12px; background: #1a1a1a; border-radius: 3px; overflow: hidden; position: relative; }
    .meter-fill { height: 100%; border-radius: 3px; transition: width 50ms; }
    .meter-peak { position: absolute; top: 0; width: 2px; height: 100%; background: var(--red); transition: left 50ms; }
    .meter-value { font-size: 0.8rem; font-weight: 700; width: 60px; text-align: right; font-variant-numeric: tabular-nums; }

    /* Info Bar */
    .info-bar {
      display: flex; gap: 24px; margin-bottom: 16px; font-size: 0.7rem;
      background: var(--card); padding: 10px 16px; border-radius: 6px; border: 1px solid var(--border);
    }
    .info-item .label { color: var(--dim); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; }
    .info-item .value { color: var(--accent); font-weight: 700; font-size: 0.85rem; font-variant-numeric: tabular-nums; }

    /* Canvas containers */
    .viz-container {
      background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      padding: 12px; margin-bottom: 16px;
    }
    .viz-title {
      font-size: 0.6rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.15em; color: var(--dim); margin-bottom: 8px;
    }
    canvas { width: 100%; border-radius: 4px; display: block; }

    /* Feedback Alert */
    .feedback-alert {
      background: rgba(255, 68, 68, 0.1); border: 1px solid var(--red); border-radius: 6px;
      padding: 10px 16px; margin-bottom: 16px; font-size: 0.75rem; display: none;
    }
    .feedback-alert.active { display: block; }
    .feedback-freq { color: var(--red); font-weight: 700; font-size: 1rem; }

    /* Band selector */
    .band-toggle { display: flex; gap: 4px; }
    .band-toggle button { font-size: 0.65rem; padding: 4px 8px; }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">ARC <span>Audio Analyzer</span></div>
    <span id="status" style="font-size:0.65rem;color:var(--dim)">Disconnected</span>
  </header>

  <div class="controls">
    <select id="device-select"><option value="">Loading devices...</option></select>
    <button id="start-btn">Start</button>
    <button id="stop-btn" style="display:none">Stop</button>
    <div style="flex:1"></div>
    <div class="band-toggle">
      <button id="mode-7" class="btn-active">7-Band</button>
      <button id="mode-31">31-Band</button>
    </div>
    <select id="fft-size">
      <option value="1024">FFT 1024</option>
      <option value="2048" selected>FFT 2048</option>
      <option value="4096">FFT 4096</option>
    </select>
  </div>

  <div class="main">
    <!-- Level Meter -->
    <div class="meter-row">
      <span class="meter-label">Level</span>
      <div class="meter-bar">
        <div class="meter-fill" id="level-fill" style="width:0%;background:var(--accent)"></div>
        <div class="meter-peak" id="level-peak" style="left:0%"></div>
      </div>
      <span class="meter-value" id="level-db">-inf dB</span>
    </div>

    <!-- Info Bar -->
    <div class="info-bar">
      <div class="info-item"><div class="label">Dominant Freq</div><div class="value" id="dom-freq">-- Hz</div></div>
      <div class="info-item"><div class="label">Peak</div><div class="value" id="peak-val">--</div></div>
      <div class="info-item"><div class="label">Tempo</div><div class="value" id="tempo-val">-- BPM</div></div>
      <div class="info-item"><div class="label">Beat</div><div class="value" id="beat-val">--</div></div>
    </div>

    <!-- Feedback Alert -->
    <div class="feedback-alert" id="feedback-alert">
      Possible feedback detected at <span class="feedback-freq" id="feedback-freq">-- Hz</span>
    </div>

    <!-- RTA Bars -->
    <div class="viz-container">
      <div class="viz-title">Real-Time Analyzer</div>
      <canvas id="rta-canvas" height="200"></canvas>
    </div>

    <!-- Spectrogram -->
    <div class="viz-container">
      <div class="viz-title">Spectrogram (Waterfall)</div>
      <canvas id="spectrogram-canvas" height="200"></canvas>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
  <script>
    // === Socket Connection ===
    const socket = io();
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const deviceSelect = document.getElementById('device-select');

    // === Canvas Setup ===
    const rtaCanvas = document.getElementById('rta-canvas');
    const rtaCtx = rtaCanvas.getContext('2d');
    const specCanvas = document.getElementById('spectrogram-canvas');
    const specCtx = specCanvas.getContext('2d');

    let bandMode = 7; // 7 or 31
    const BAND_LABELS_7 = ['Sub', 'Bass', 'Lo-Mid', 'Mid', 'Hi-Mid', 'Pres', 'Brill'];
    const BAND_RANGES_7 = ['20-60', '60-250', '250-500', '500-2k', '2k-4k', '4k-6k', '6k-20k'];

    // Peak hold
    let peakHold = new Array(256).fill(0);
    const PEAK_DECAY = 0.005;

    // Spectrogram history
    let spectrogramHistory = [];
    const SPECTROGRAM_LINES = 200;

    // Feedback detection
    let feedbackHistory = new Array(256).fill(0);
    const FEEDBACK_THRESHOLD = 6; // dB above neighbors
    const FEEDBACK_SUSTAIN = 60;  // ~2 seconds at 30fps

    function resizeCanvases() {
      const w = rtaCanvas.parentElement.clientWidth - 24;
      rtaCanvas.width = w;
      rtaCanvas.height = 200;
      specCanvas.width = w;
      specCanvas.height = 200;
    }
    resizeCanvases();
    window.addEventListener('resize', resizeCanvases);

    // === Fetch Devices ===
    fetch('/devices').then(r => r.json()).then(devices => {
      deviceSelect.innerHTML = '<option value="">Default Input</option>';
      devices.forEach(d => {
        deviceSelect.innerHTML += `<option value="${d.index}">${d.name} (${d.channels}ch)</option>`;
      });
    });

    // === Controls ===
    startBtn.addEventListener('click', () => {
      const dev = deviceSelect.value;
      socket.emit('start_stream', dev ? { device: parseInt(dev) } : {});
    });
    stopBtn.addEventListener('click', () => socket.emit('stop_stream'));

    document.getElementById('mode-7').addEventListener('click', () => {
      bandMode = 7;
      document.getElementById('mode-7').classList.add('btn-active');
      document.getElementById('mode-31').classList.remove('btn-active');
    });
    document.getElementById('mode-31').addEventListener('click', () => {
      bandMode = 31;
      document.getElementById('mode-31').classList.add('btn-active');
      document.getElementById('mode-7').classList.remove('btn-active');
    });

    // === Socket Events ===
    socket.on('connect', () => { statusEl.textContent = 'Connected'; statusEl.style.color = '#00ff88'; });
    socket.on('disconnect', () => { statusEl.textContent = 'Disconnected'; statusEl.style.color = '#888'; });

    socket.on('stream_status', data => {
      if (data.active) {
        startBtn.style.display = 'none';
        stopBtn.style.display = '';
        statusEl.textContent = 'Streaming';
      } else {
        startBtn.style.display = '';
        stopBtn.style.display = 'none';
        statusEl.textContent = data.error ? `Error: ${data.error}` : 'Stopped';
      }
    });

    socket.on('audio_data', data => {
      updateMeters(data);
      drawRTA(data);
      drawSpectrogram(data.spectrum);
      detectFeedback(data.spectrum, data.dominant_freq);
    });

    // === Update Meters ===
    function updateMeters(data) {
      const db = Math.max(-60, data.db);
      const pct = ((db + 60) / 60) * 100;
      const fill = document.getElementById('level-fill');
      const peak = document.getElementById('level-peak');

      fill.style.width = pct + '%';
      fill.style.background = db > -6 ? '#ff4444' : db > -12 ? '#ffaa00' : '#00ff88';
      peak.style.left = Math.min(100, pct + 2) + '%';

      document.getElementById('level-db').textContent = db.toFixed(1) + ' dB';
      document.getElementById('dom-freq').textContent = data.dominant_freq > 0 ? Math.round(data.dominant_freq) + ' Hz' : '-- Hz';
      document.getElementById('peak-val').textContent = data.peak.toFixed(3);
      document.getElementById('tempo-val').textContent = data.tempo > 0 ? Math.round(data.tempo) + ' BPM' : '-- BPM';
      document.getElementById('beat-val').textContent = data.is_beat ? 'BEAT' : '--';
      document.getElementById('beat-val').style.color = data.is_beat ? '#00ff88' : '#888';
    }

    // === Draw RTA ===
    function drawRTA(data) {
      const w = rtaCanvas.width;
      const h = rtaCanvas.height;
      rtaCtx.clearRect(0, 0, w, h);

      if (bandMode === 7) {
        // 7-band mode using pre-computed band energies
        const bands = data.bands;
        const barW = (w / bands.length) - 4;

        bands.forEach((val, i) => {
          const barH = val * h * 0.9;
          const x = i * (barW + 4) + 2;
          const y = h - barH;

          // Bar gradient
          const grad = rtaCtx.createLinearGradient(x, h, x, y);
          grad.addColorStop(0, '#00ff88');
          grad.addColorStop(0.6, '#00cc6e');
          grad.addColorStop(1, val > 0.8 ? '#ff4444' : '#ffaa00');
          rtaCtx.fillStyle = grad;
          rtaCtx.fillRect(x, y, barW, barH);

          // Label
          rtaCtx.fillStyle = '#888';
          rtaCtx.font = '9px monospace';
          rtaCtx.textAlign = 'center';
          rtaCtx.fillText(BAND_LABELS_7[i], x + barW / 2, h - 2);
        });
      } else {
        // 31-band mode from spectrum data
        const spectrum = data.spectrum;
        const numBars = Math.min(31, spectrum.length);
        const barW = (w / numBars) - 2;

        for (let i = 0; i < numBars; i++) {
          // Map 31 bars logarithmically across spectrum
          const specIdx = Math.floor(Math.pow(i / numBars, 2) * spectrum.length);
          const val = spectrum[Math.min(specIdx, spectrum.length - 1)];
          const barH = val * h * 0.9;
          const x = i * (barW + 2) + 1;
          const y = h - barH;

          // Peak hold
          if (val > peakHold[i]) peakHold[i] = val;
          else peakHold[i] = Math.max(0, peakHold[i] - PEAK_DECAY);

          // Bar
          const grad = rtaCtx.createLinearGradient(x, h, x, y);
          grad.addColorStop(0, '#00ff88');
          grad.addColorStop(1, val > 0.8 ? '#ff4444' : '#ffaa00');
          rtaCtx.fillStyle = grad;
          rtaCtx.fillRect(x, y, barW, barH);

          // Peak marker
          const peakY = h - peakHold[i] * h * 0.9;
          rtaCtx.fillStyle = '#ffffff';
          rtaCtx.fillRect(x, peakY, barW, 2);
        }
      }
    }

    // === Draw Spectrogram ===
    function drawSpectrogram(spectrum) {
      const w = specCanvas.width;
      const h = specCanvas.height;

      // Add new line
      spectrogramHistory.push(spectrum.slice());
      if (spectrogramHistory.length > SPECTROGRAM_LINES) {
        spectrogramHistory.shift();
      }

      specCtx.clearRect(0, 0, w, h);
      const lineH = h / SPECTROGRAM_LINES;

      spectrogramHistory.forEach((line, row) => {
        const y = row * lineH;
        const binW = w / line.length;

        line.forEach((val, col) => {
          const x = col * binW;
          // Color map: black -> blue -> green -> yellow -> red
          const hue = (1 - val) * 240; // 240=blue, 0=red
          const light = val * 50 + 5;
          specCtx.fillStyle = `hsl(${hue}, 100%, ${light}%)`;
          specCtx.fillRect(x, y, Math.ceil(binW), Math.ceil(lineH));
        });
      });
    }

    // === Feedback Detection ===
    function detectFeedback(spectrum, dominantFreq) {
      const alert = document.getElementById('feedback-alert');
      const freqEl = document.getElementById('feedback-freq');

      // Check for sustained narrow peaks
      let feedbackDetected = false;
      let feedbackFreqHz = 0;

      for (let i = 2; i < spectrum.length - 2; i++) {
        const val = spectrum[i];
        const neighbors = (spectrum[i-2] + spectrum[i-1] + spectrum[i+1] + spectrum[i+2]) / 4;
        const ratio = neighbors > 0 ? val / neighbors : 0;

        if (ratio > 2.0) { // 6dB above neighbors (2x = ~6dB)
          feedbackHistory[i]++;
          if (feedbackHistory[i] > FEEDBACK_SUSTAIN) {
            feedbackDetected = true;
            // Approximate frequency from bin index
            feedbackFreqHz = Math.round((i / spectrum.length) * 22050);
          }
        } else {
          feedbackHistory[i] = Math.max(0, feedbackHistory[i] - 1);
        }
      }

      if (feedbackDetected) {
        alert.classList.add('active');
        freqEl.textContent = feedbackFreqHz + ' Hz';
      } else {
        alert.classList.remove('active');
      }
    }
  </script>

</body>
</html>
