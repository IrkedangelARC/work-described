name: ArcLowerThirds
options:
  bundleIdPrefix: com.example.arc
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"

packages:
  ARCDeckLink:
    path: ../arc-decklink-output

targets:
  ArcLowerThirds:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: ArcLowerThirds
      - path: sample_graphics.json
        type: file
        buildPhase: resources
    dependencies:
      - package: ARCDeckLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.arc.ArcLowerThirds
        PRODUCT_NAME: ARC Lower Thirds
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: ArcLowerThirds/Info.plist
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 ARC Event Productions. We don't sell failure™."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true

  ArcLowerThirdsTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: ArcLowerThirdsTests
    dependencies:
      - target: ArcLowerThirds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.arc.ArcLowerThirdsTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ARC Lower Thirds.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ARC Lower Thirds"
        BUNDLE_LOADER: "$(TEST_HOST)"
        DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
