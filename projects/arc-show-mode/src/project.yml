name: ArcShowMode
options:
  bundleIdPrefix: com.example.arc
  deploymentTarget:
    macOS: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  ArcShowMode:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: ArcShowMode
        excludes:
          - Resources
      - path: ArcShowMode/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.arc.ArcShowMode
        PRODUCT_NAME: ARC Show Mode
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ArcShowMode/Info.plist
        DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: ArcShowMode/ArcShowMode.entitlements

  ArcShowModeTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: ArcShowModeTests
    dependencies:
      - target: ArcShowMode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.arc.ArcShowModeTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ARC Show Mode.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ARC Show Mode"
        BUNDLE_LOADER: "$(TEST_HOST)"
        DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
