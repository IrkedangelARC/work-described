name: ArcKeyer
options:
  bundleIdPrefix: com.example.arc
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"

packages:
  ARCDeckLink:
    path: ../arc-decklink-output
  ARCStyle:
    path: ../arc-style

targets:
  ArcKeyer:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: ArcKeyer
    dependencies:
      - package: ARCDeckLink
      - package: ARCStyle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.arc.ArcKeyer
        PRODUCT_NAME: ARC Keyer
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: ArcKeyer/Info.plist
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 ARC Event Productions. We don't sell failure™."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: ArcKeyer/ArcKeyer.entitlements

  ArcKeyerTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: ArcKeyerTests
    dependencies:
      - target: ArcKeyer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.arc.ArcKeyerTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ARC Keyer.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ARC Keyer"
        BUNDLE_LOADER: "$(TEST_HOST)"
        DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
