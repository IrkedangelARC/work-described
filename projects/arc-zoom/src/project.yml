name: ArcZoom
options:
  bundleIdPrefix: com.example.arc
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"

packages:
  ARCStyle:
    path: ../arc-style

targets:
  ArcZoom:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: ArcZoom
    postCompileScripts:
      # Build number = commits on HEAD, plus the short hash, stamped into the BUILT Info.plist so every
      # binary is identifiable in a show log (audit P2: every build was "1"). The source plist stays clean.
      - name: Stamp build number and git hash
        script: |
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          if [ -f "$PLIST" ] && command -v git >/dev/null; then
            COUNT=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null || echo 0)
            HASH=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo unknown)
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $COUNT" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $COUNT" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :ARCGitHash $HASH" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :ARCGitHash string $HASH" "$PLIST"
          fi
    dependencies:
      - package: ARCStyle
      # The Zoom Meeting SDK, v7.1.5.84750, in sdk/ZoomSDK (gitignored, 612 MB, per machine:
      # docs/ACCOUNT_SETUP.md). Zoom's own sample links exactly these four; the rest of the 38
      # frameworks and 28 bundles are copied into Contents/Frameworks by the phase below, because
      # ZoomSDK dlopens them at runtime. `embed: false` here: the copy phase owns placement.
      - framework: sdk/ZoomSDK/ZoomSDK.framework
        embed: false
      - framework: sdk/ZoomSDK/ZoomSettingEx.framework
        embed: false
      - framework: sdk/ZoomSDK/zVideoUIEx.framework
        embed: false
      - framework: sdk/ZoomSDK/zm_conf_universal_ui_plugin.framework
        embed: false
    postBuildScripts:
      - name: Embed the Zoom Meeting SDK
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="$SRCROOT/sdk/ZoomSDK"
          DST="$BUILT_PRODUCTS_DIR/$WRAPPER_NAME/Contents/Frameworks"
          if [ ! -d "$SRC" ]; then
            echo "error: the Zoom Meeting SDK is not in sdk/ZoomSDK. See docs/ACCOUNT_SETUP.md step 2."
            exit 1
          fi
          mkdir -p "$DST"
          # EVERYTHING, not just the frameworks. The SDK's 83 items are 38 frameworks, 28 bundles,
          # 11 loose dylibs and 6 helper .apps (aomhost, CptHost, capHost, airhost, SDK_Transcode,
          # ZMScreenshot). Copying only *.framework and *.bundle made ZoomSDK fail to load
          # @rpath/liblooper.dylib and the app died in dyld before main (2026-09-20).
          # ditto per item, not the folder, so nothing already in Frameworks is blown away.
          for item in "$SRC"/*; do
            [ -e "$item" ] || continue
            ditto "$item" "$DST/$(basename "$item")"
          done
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/sdk/ZoomSDK"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @loader_path/../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.example.arc.ArcZoom
        PRODUCT_NAME: ARC Zoom
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.11.1"
        CURRENT_PROJECT_VERSION: "6"
        DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
        # Developer ID on EVERY configuration, not Apple Development: the keychain items (the Marketplace
        # pair, the OPERATOR login, the OAuth tokens) trust the Developer ID signature, and an Apple
        # Development Debug build was a stranger to them, one password dialog per item per read
        # (2026-09-23, five in a row on every test run). Same reason ARC Capture signs Debug this way:
        # TCC grants survive rebuilds.
        CODE_SIGN_IDENTITY: "Developer ID Application: YOUR NAME (YOUR_TEAM_ID)"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: true
        PRODUCT_MODULE_NAME: ArcZoom
        CODE_SIGN_ENTITLEMENTS: ArcZoom/ArcZoom.entitlements
    info:
      path: ArcZoom/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Copyright (c) 2026 ARC Event Productions. We don't sell failure™."
        # Every permission the app can ask for needs its reason here BEFORE it ever asks: ARC Presenter
        # 4.0 shipped without the screen one and the prompt simply never appeared.
        NSCameraUsageDescription: "ARC Zoom joins the meeting on ARC's behalf and can send a camera into it when a show needs the room on screen."
        NSMicrophoneUsageDescription: "ARC Zoom joins the meeting on ARC's behalf and can send room audio into it when the console is not carrying the mix."
        NSScreenCaptureUsageDescription: "ARC Zoom shares the slides into the meeting by sharing ARC Presenter's program window, so remote attendees see what the room sees."
        NSAudioCaptureUsageDescription: "ARC Zoom sends the sound of a shared window into the meeting, so a video played to the room is heard by remote attendees too."

  ArcZoomTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: ArcZoomTests
    dependencies:
      - target: ArcZoom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.arc.ArcZoomTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ARC Zoom.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ARC Zoom"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # @testable import ArcZoom pulls in the ZoomSDK module, so the tests need to find it too.
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/sdk/ZoomSDK"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @loader_path/../Frameworks @executable_path/../Frameworks"
        DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
        # Same identity as the host: a hardened Developer ID app only loads a bundle from its own team.
        CODE_SIGN_IDENTITY: "Developer ID Application: YOUR NAME (YOUR_TEAM_ID)"
        CODE_SIGN_STYLE: Manual

schemes:
  ArcZoom:
    build:
      targets:
        ArcZoom: all
        ArcZoomTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArcZoomTests
